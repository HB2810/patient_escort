<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stavya Spine Hospital - Escort Coordination</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <style>
      :root {
        /* Primary brand color: Stavya Blue */
        --stavya-blue: #1B6CA8;
        --bg-color: #F8F9FA;
      }
      body {
        background-color: var(--bg-color);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      .navbar {
        background-color: white;
        border-bottom: 2px solid var(--stavya-blue);
      }
      .btn-primary {
        background-color: var(--stavya-blue);
        border-color: var(--stavya-blue);
      }
      .btn-primary:hover {
        background-color: #14507c;
        border-color: #14507c;
      }
      .touch-target {
        min-height: 48px;
        min-width: 48px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
